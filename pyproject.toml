[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaacgrasp"
version = "0.1.0"
description = "Does the orientation failure in Simulated-grasping survive more data? An Isaac Lab port and a data-scaling curve."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# simgrasp carries the model, the training loop, the dataset format, the
# heuristic baseline and the evaluation harness. It is pinned to an exact commit
# because this project's entire claim is that those pieces are UNCHANGED from the
# original study. A floating dependency would quietly void the comparison.
dependencies = [
    "simgrasp @ git+https://github.com/abyyworld/Simulated-grasping.git@379e4cad767cbea029a8c5e0031b414861c517ff",
    "numpy>=1.24",
    "torch>=2.1",
    "torchvision>=0.16",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
# Isaac Lab is NOT a pip dependency. It ships as a conda/container distribution
# with a pinned Isaac Sim runtime; see docs/setup-cloud.md.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
