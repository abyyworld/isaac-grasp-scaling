name: ci

# CI runs everything that does not need a GPU, which is the whole project except
# the Isaac Lab backend itself. That backend is exercised by
# scripts/check_setup.py --isaac on a rented box; see docs/setup-cloud.md.
#
# The predecessor repository's CI was green for weeks while a fresh clone could
# not import the package, because CI tested a working tree rather than a
# checkout. test_repo_integrity.py is what closes that hole, so it runs here.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the software renderer
        # No GPU on a CI runner, so MuJoCo falls back to OSMesa.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch the Panda assets
        # The robot meshes are not vendored in either repository. This also
        # exercises isaacgrasp.assets, which exists because simgrasp resolves
        # its own asset directory relative to a checkout and this project
        # depends on it as a pinned git install, where that resolution is wrong.
        run: python scripts/fetch_assets.py

      - name: Lint
        run: ruff check src scripts tests

      - name: Check out simgrasp at the pinned commit
        # The MuJoCo Menagerie pin lives in simgrasp's scripts/, which the wheel
        # does not ship. Without a checkout the parity test has nothing to
        # compare against and skips, so this clones the same commit that
        # pyproject.toml already installs and points the test at it.
        run: |
          sha=$(python -c "import re,pathlib; \
            print(re.search(r'Simulated-grasping\.git@([0-9a-f]{40})', \
            pathlib.Path('pyproject.toml').read_text()).group(1))")
          echo "simgrasp pinned at ${sha}"
          mkdir -p /tmp/simgrasp && git -C /tmp/simgrasp init -q
          git -C /tmp/simgrasp remote add origin \
            https://github.com/abyyworld/Simulated-grasping.git
          git -C /tmp/simgrasp fetch -q --depth 1 origin "${sha}"
          git -C /tmp/simgrasp checkout -q FETCH_HEAD

      - name: Test
        env:
          MUJOCO_GL: osmesa
          SIMGRASP_CHECKOUT: /tmp/simgrasp
        run: pytest tests/ -q

      - name: Verify the install by running it
        env:
          MUJOCO_GL: osmesa
        run: python scripts/check_setup.py
